# Lokalizatsiya konfiguratsiyasi (flutter gen-l10n).
# Barcha foydalanuvchiga ko‘rinadigan matnlar ARB fayllarida.
arb-dir: lib/core/l10n/arb
template-arb-file: app_en.arb
output-dir: lib/core/l10n/generated
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
required-resource-attributes: true
untranslated-messages-file: build/l10n_untranslated.json
