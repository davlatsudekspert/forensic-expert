name: forensic_expert
description: "FORENSIC EXPERT — professional forensic reference, education and scientific calculation software."
publish_to: 'none'
version: 0.3.0+3
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  fe_calc_engine:
    path: ../../packages/fe_calc_engine
  fe_content_package:
    path: ../../packages/fe_content_package
  fe_content_schema:
    path: ../../packages/fe_content_schema
  fe_database:
    path: ../../packages/fe_database
  fe_search_core:
    path: ../../packages/fe_search_core
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  shared_preferences: ^2.5.5
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3
  in_app_purchase_storekit: ^0.4.13
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.7
  url_launcher: ^6.3.3
  file_selector: ^1.1.0
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/inter/OFL.txt
    - assets/fonts/jetbrains_mono/OFL.txt
    - assets/fonts/source_serif_4/OFL.txt
    - assets/content/pilot/
    - assets/content/guidelines/

  # Shriftlar ilovaga o‘rnatilgan (offline; runtime’da yuklanmaydi). SIL OFL 1.1.
  fonts:
    # Source Serif 4 (Adobe, SIL OFL 1.1) — sarlavhalar. Litsenziya:
    # assets/fonts/source_serif_4/OFL.txt
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/source_serif_4/SourceSerif4-Regular.ttf
        - asset: assets/fonts/source_serif_4/SourceSerif4-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/source_serif_4/SourceSerif4-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-Medium.ttf
          weight: 500
