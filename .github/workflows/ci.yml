# FORENSIC EXPERT — CI
# Har bir push va PR’da: format, generatsiya qilingan kod, statik tahlil,
# barcha testlar, secret scanning va dependency xavfsizlik tekshiruvi.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies (bitta workspace lockfile)
        run: flutter pub get --enforce-lockfile

      - name: Generated code is up to date (drift, gen-l10n)
        run: |
          (cd packages/fe_database && dart run build_runner build)
          (cd apps/mobile && flutter gen-l10n)
          git diff --exit-code

      - name: Format
        run: dart format --output=none --set-exit-if-changed $(git ls-files '*.dart' | grep -v -E '\.g\.dart$|/generated/')

      - name: Analyze (packages)
        run: dart analyze --fatal-infos packages

      - name: Analyze (app)
        working-directory: apps/mobile
        run: flutter analyze --fatal-infos

      - name: Test (pure Dart packages)
        run: |
          for p in packages/*; do
            echo "::group::$p"
            (cd "$p" && dart test)
            echo "::endgroup::"
          done

      - name: Test (app — unit, widget, a11y, l10n, architecture, offline)
        working-directory: apps/mobile
        run: flutter test --coverage

  db-security:
    name: Supabase migration security tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run migration + RLS/RPC security tests on local PostgreSQL
        run: |
          PGBIN="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          PGBIN="$PGBIN" bash supabase/tests/run_local.sh 2>&1 | tee db.log
          grep -q "ALL SECURITY TESTS PASSED" db.log
          grep -q "ALL RLS ROLE MATRIX TESTS PASSED" db.log
          ! grep -q "FAIL" db.log

  secrets-inventory:
    # Reports ONLY whether external credentials exist (true/false); values are
    # never printed. Used for the release blocker report.
    runs-on: ubuntu-latest
    steps:
      - name: Credential presence
        env:
          GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          SUPABASE_REF: ${{ secrets.SUPABASE_PROJECT_REF != '' }}
          FE_SUPABASE_URL: ${{ secrets.FE_SUPABASE_URL != '' }}
          FE_SUPABASE_ANON_KEY: ${{ secrets.FE_SUPABASE_ANON_KEY != '' }}
          SMTP: ${{ secrets.FE_SMTP_PASS != '' }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
          APPLE_TEAM: ${{ secrets.APPLE_TEAM_ID != '' }}
          ASC_KEY: ${{ secrets.ASC_PRIVATE_KEY != '' }}
        run: |
          for v in GEMINI SUPABASE_TOKEN SUPABASE_REF FE_SUPABASE_URL FE_SUPABASE_ANON_KEY SMTP ANDROID_KEYSTORE PLAY_JSON APPLE_TEAM ASC_KEY; do
            echo "$v=${!v}"
          done | tee -a "$GITHUB_STEP_SUMMARY"

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact -v .

  dependency-scan:
    name: Dependency vulnerabilities (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: osv-scanner
        run: |
          curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.2.2/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile=pubspec.lock

  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
