# FORENSIC EXPERT — Play Console do‘kon grafikasini yuklash.
#
# Faqat qo‘lda ishga tushiriladi. Ikonka, feature grafika va telefon
# skrinshotlarini `docs/play_store/graphics/` dan Play Console’ga yuklaydi.
# Reliz chiqarmaydi, AAB yubormaydi, track’ga tegmaydi.
#
# Xizmat hisobi kaliti faqat `PLAY_SERVICE_ACCOUNT_JSON` sirida; jurnalga
# hech qachon chiqmaydi.
name: Store graphics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    name: Upload listing graphics to Play
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FE_ANDROID_PACKAGE: uz.forensicexpert.forensic_expert
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Stop early if the Play credential is missing
        run: |
          if [ "$HAS_PLAY" != "true" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not configured"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-auth requests
      - name: Upload icon, feature graphic and screenshots
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 tool/play_store_graphics.py
