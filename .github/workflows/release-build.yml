# FORENSIC EXPERT — release build (Android AAB/APK, iOS archive).
#
# * Sirlar faqat GitHub Secrets orqali; hech qachon chop etilmaydi yoki commit
#   qilinmaydi. Sir bo‘lmasa — imzosiz/debug yo‘l, va bu artefakt nomida va
#   jurnalda OCHIQ yoziladi (soxta "signed" yo‘q).
# * App Review’ga yuborish yoki ommaviy release YO‘Q. TestFlight’ga yuklash
#   faqat qo‘lda ishga tushirilganda (workflow_dispatch, testflight=true) va
#   barcha App Store Connect sirlari mavjud bo‘lsa.
name: Release build

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload signed IPA to TestFlight (requires ASC secrets)"
        type: boolean
        default: false
      play_internal:
        description: "Upload release-signed AAB to Google Play INTERNAL testing as a DRAFT (requires signing + PLAY_SERVICE_ACCOUNT_JSON)"
        type: boolean
        default: false
  push:
    branches:
      - claude/phase-8-12-final-release
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  android:
    name: Android (AAB + APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      # FORENSIC EXPERT backend (public URL + anon key only; never service role).
      FE_SUPABASE_URL: ${{ secrets.FE_SUPABASE_URL }}
      FE_SUPABASE_ANON_KEY: ${{ secrets.FE_SUPABASE_ANON_KEY }}
      HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
      # Mavjud FORENSIC EXPERT ilovasining o‘zgarmas ID’si. Boshqa ilovalar
      # (NFCSTORE, BugunBor) hech qachon nishon bo‘lmaydi.
      FE_ANDROID_PACKAGE: uz.forensicexpert.forensic_expert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Release signing from secrets (if configured)
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "FE_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build AAB and APK
        working-directory: apps/mobile
        env:
          FE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$HAS_ANDROID_SIGNING" = "true" ]; then
            # Kalitsiz build jim debug imzoga tushmasin — to‘xtasin.
            export ORG_GRADLE_PROJECT_requireReleaseSigning=true
          fi
          DEFINES=""
          if [ -n "$FE_SUPABASE_URL" ] && [ -n "$FE_SUPABASE_ANON_KEY" ]; then
            DEFINES="--dart-define=FE_SUPABASE_URL=$FE_SUPABASE_URL --dart-define=FE_SUPABASE_ANON_KEY=$FE_SUPABASE_ANON_KEY"
            [ "$HAS_GEMINI" = "true" ] && DEFINES="$DEFINES --dart-define=FE_AI_REMOTE=true"
            echo "::notice::Backend: FORENSIC EXPERT Supabase configured (AI remote: $HAS_GEMINI)"
          else
            echo "::notice::Backend NOT configured (FE_SUPABASE_URL / FE_SUPABASE_ANON_KEY missing) — offline build, account shows 'not connected'"
          fi
          flutter build appbundle --release $DEFINES
          flutter build apk --release $DEFINES
          mkdir -p "$RUNNER_TEMP/out"
          if [ "$HAS_ANDROID_SIGNING" = "true" ]; then
            SIGN=release-signed
            AAB_NAME="forensic-expert-release.aab"
            APK_NAME="forensic-expert-release.apk"
          else
            SIGN=DEBUG-SIGNED-not-for-store
            AAB_NAME="forensic-expert-DEBUG-SIGNED-not-for-store.aab"
            # Faqat real qurilmada sinash uchun (debug imzo, store’ga emas).
            APK_NAME="forensic-expert-FINAL-REAL-DEVICE-TEST.apk"
          fi
          echo "SIGNING_STATUS=$SIGN" >> "$GITHUB_ENV"
          echo "AAB_NAME=$AAB_NAME" >> "$GITHUB_ENV"
          cp build/app/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/$AAB_NAME"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/out/$APK_NAME"
          (cd "$RUNNER_TEMP/out" && sha256sum *.apk *.aab > SHA256SUMS.txt && cat SHA256SUMS.txt && ls -l)
      - name: Verify package, version and signature
        working-directory: apps/mobile
        run: |
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$AAPT2" dump badging "$APK" | head -1
          PKG="$("$AAPT2" dump packagename "$APK")"
          if [ "$PKG" != "$FE_ANDROID_PACKAGE" ]; then
            echo "::error::package mismatch: $PKG (expected $FE_ANDROID_PACKAGE)"; exit 1; fi
          "$APKSIGNER" verify --print-certs "$APK" | grep -E "certificate DN|SHA-256" || true
          # AAB imzosi (JAR imzo) — sertifikat egasi.
          AAB_CERT="$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -m1 'Owner:' || true)"
          echo "AAB signer: $AAB_CERT"
          if [ "$HAS_ANDROID_SIGNING" = "true" ]; then
            if echo "$AAB_CERT" | grep -q "CN=Android Debug"; then
              echo "::error::AAB is DEBUG signed although release signing was configured"; exit 1; fi
            if "$APKSIGNER" verify --print-certs "$APK" | grep -q "CN=Android Debug"; then
              echo "::error::APK is DEBUG signed"; exit 1; fi
            echo "Release signing verified."
          else
            echo "::notice::ANDROID RELEASE SIGNING NOT CONFIGURED — DEBUG SIGNED, NOT FOR STORE. Required secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.SIGNING_STATUS }}-${{ github.sha }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
          if-no-files-found: error
      - name: Play upload status
        run: |
          if [ "$HAS_PLAY" != "true" ]; then
            echo "::notice::GOOGLE PLAY UPLOAD BLOCKED BY CREDENTIALS — required secret: PLAY_SERVICE_ACCOUNT_JSON (service account with release access to the existing FORENSIC EXPERT app only)"; fi
      # Faqat qo‘lda, faqat release imzo bilan, faqat INTERNAL testing,
      # faqat DRAFT (egasi Play Console’da o‘zi rollout qiladi). Production YO‘Q.
      - name: Upload to Google Play — internal testing (draft)
        if: env.HAS_PLAY == 'true' && env.HAS_ANDROID_SIGNING == 'true' && github.event_name == 'workflow_dispatch' && inputs.play_internal
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.FE_ANDROID_PACKAGE }}
          releaseFiles: ${{ runner.temp }}/out/${{ env.AAB_NAME }}
          track: internal
          status: draft

  ios:
    name: iOS (compile + archive)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_PRIVATE_KEY != '' && secrets.APPLE_TEAM_ID != '' }}
      # FORENSIC EXPERT backend (public URL + anon key only; never service role).
      FE_SUPABASE_URL: ${{ secrets.FE_SUPABASE_URL }}
      FE_SUPABASE_ANON_KEY: ${{ secrets.FE_SUPABASE_ANON_KEY }}
      HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Podfile / Swift Package Manager integratsiyasini `flutter build ios`
      # o‘zi yaratadi va o‘rnatadi (repozitoriyda Podfile yo‘q).
      - name: Compile (no codesign) — proves the iOS build
        working-directory: apps/mobile
        run: |
          DEFINES=""
          if [ -n "$FE_SUPABASE_URL" ] && [ -n "$FE_SUPABASE_ANON_KEY" ]; then
            DEFINES="--dart-define=FE_SUPABASE_URL=$FE_SUPABASE_URL --dart-define=FE_SUPABASE_ANON_KEY=$FE_SUPABASE_ANON_KEY"
            [ "$HAS_GEMINI" = "true" ] && DEFINES="$DEFINES --dart-define=FE_AI_REMOTE=true"
            echo "::notice::Backend: FORENSIC EXPERT Supabase configured (AI remote: $HAS_GEMINI)"
          else
            echo "::notice::Backend NOT configured (FE_SUPABASE_URL / FE_SUPABASE_ANON_KEY missing) — offline build, account shows 'not connected'"
          fi
          echo "DEFINES=$DEFINES" >> "$GITHUB_ENV"
          flutter build ios --release --no-codesign $DEFINES
      - name: Unsigned archive (xcarchive)
        working-directory: apps/mobile
        run: |
          flutter build ipa --release --no-codesign $DEFINES
          mkdir -p "$RUNNER_TEMP/ios"
          ditto -c -k --keepParent build/ios/archive/Runner.xcarchive "$RUNNER_TEMP/ios/Runner-UNSIGNED.xcarchive.zip"
          (cd "$RUNNER_TEMP/ios" && shasum -a 256 * | tee SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ios-UNSIGNED-archive-${{ github.sha }}
          path: ${{ runner.temp }}/ios/
          retention-days: 30
      - name: Signing status
        run: |
          if [ "$HAS_ASC" = "true" ]; then echo "App Store Connect secrets present"; else
            echo "::notice::TESTFLIGHT UPLOAD BLOCKED BY CREDENTIALS — required secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY, APPLE_TEAM_ID (and an App Store Connect app record for the bundle id)"; fi
      - name: Signed IPA + TestFlight upload (manual, credentials required)
        if: env.HAS_ASC == 'true' && github.event_name == 'workflow_dispatch' && inputs.testflight
        working-directory: apps/mobile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash ../../tool/ios_testflight.sh
      - name: Upload signed IPA artifact
        if: env.HAS_ASC == 'true' && github.event_name == 'workflow_dispatch' && inputs.testflight
        uses: actions/upload-artifact@v4
        with:
          name: ios-APPSTORE-SIGNED-ipa-${{ github.sha }}
          path: apps/mobile/build/ios/ipa/
          retention-days: 30
