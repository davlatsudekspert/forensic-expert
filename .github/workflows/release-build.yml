# FORENSIC EXPERT — release build (Android AAB/APK, iOS archive).
#
# * Sirlar faqat GitHub Secrets orqali; hech qachon chop etilmaydi yoki commit
#   qilinmaydi. Sir bo‘lmasa — imzosiz/debug yo‘l, va bu artefakt nomida va
#   jurnalda OCHIQ yoziladi (soxta "signed" yo‘q).
# * App Review’ga yuborish yoki ommaviy release YO‘Q. TestFlight’ga yuklash
#   faqat qo‘lda ishga tushirilganda (workflow_dispatch, testflight=true) va
#   barcha App Store Connect sirlari mavjud bo‘lsa.
name: Release build

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload signed IPA to TestFlight (requires ASC secrets)"
        type: boolean
        default: false
  push:
    branches:
      - claude/phase-8-12-final-release
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  android:
    name: Android (AAB + APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Release signing from secrets (if configured)
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "FE_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build AAB and APK
        working-directory: apps/mobile
        env:
          FE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release
          flutter build apk --release
          if [ "$HAS_ANDROID_SIGNING" = "true" ]; then SIGN=release-signed; else SIGN=DEBUG-SIGNED-not-for-store; fi
          echo "SIGNING_STATUS=$SIGN" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"
          if [ "$HAS_ANDROID_SIGNING" = "true" ]; then
            APK_NAME="forensic-expert-$SIGN.apk"
          else
            # Faqat real qurilmada sinash uchun (debug imzo, store’ga emas).
            APK_NAME="forensic-expert-REAL-DEVICE-TEST-DEBUG.apk"
          fi
          cp build/app/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/forensic-expert-$SIGN.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/out/$APK_NAME"
          (cd "$RUNNER_TEMP/out" && sha256sum *.apk *.aab > SHA256SUMS.txt && cat SHA256SUMS.txt && ls -l)
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | head -5 || true
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.SIGNING_STATUS }}-${{ github.sha }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
          if-no-files-found: error

  ios:
    name: iOS (compile + archive)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_PRIVATE_KEY != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Podfile / Swift Package Manager integratsiyasini `flutter build ios`
      # o‘zi yaratadi va o‘rnatadi (repozitoriyda Podfile yo‘q).
      - name: Compile (no codesign) — proves the iOS build
        working-directory: apps/mobile
        run: flutter build ios --release --no-codesign
      - name: Unsigned archive (xcarchive)
        working-directory: apps/mobile
        run: |
          flutter build ipa --release --no-codesign
          mkdir -p "$RUNNER_TEMP/ios"
          ditto -c -k --keepParent build/ios/archive/Runner.xcarchive "$RUNNER_TEMP/ios/Runner-UNSIGNED.xcarchive.zip"
          (cd "$RUNNER_TEMP/ios" && shasum -a 256 * | tee SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ios-UNSIGNED-archive-${{ github.sha }}
          path: ${{ runner.temp }}/ios/
          retention-days: 30
      - name: Signing status
        run: |
          if [ "$HAS_ASC" = "true" ]; then echo "App Store Connect secrets present"; else
            echo "::notice::TESTFLIGHT UPLOAD BLOCKED BY CREDENTIALS — required secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY, APPLE_TEAM_ID (and an App Store Connect app record for the bundle id)"; fi
      - name: Signed IPA + TestFlight upload (manual, credentials required)
        if: env.HAS_ASC == 'true' && github.event_name == 'workflow_dispatch' && inputs.testflight
        working-directory: apps/mobile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash ../../tool/ios_testflight.sh
