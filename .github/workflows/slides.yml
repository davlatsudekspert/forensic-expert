name: slides
on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: "Mavzu id yoki vergul bilan ro'yxat"
        required: true
      max_usd:
        description: "Bir ishga tushirish byudjeti (USD)"
        default: "0.50"
      dry_run:
        description: "Dry-run (API chaqirilmaydi)"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  slides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install anthropic python-pptx
      - name: Generate
        working-directory: tools/slides
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOPIC: ${{ inputs.topic_id }}
          MAXUSD: ${{ inputs.max_usd }}
          DRY: ${{ inputs.dry_run }}
        run: |
          FLAG=""; [ "$DRY" = "true" ] && FLAG="--dry-run"
          SRC=""; [ -f sources_private/sources.json ] && SRC="--sources sources_private/sources.json"
          for T in ${TOPIC//,/ }; do
            echo "=== $T ==="
            python generate.py "$T" --max-usd "$MAXUSD" $SRC $FLAG || echo "FAIL $T"
            if [ -f "out/$T.json" ]; then python build_pptx.py "out/$T.json" || echo "PPTX FAIL $T"; fi
          done
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.dry_run != true }}
        with:
          name: slides-${{ inputs.topic_id }}
          path: tools/slides/out/
          if-no-files-found: ignore
      - name: Natijani slides-out branchiga saqlash (maxfiy repo, ilovaga tushmaydi)
        if: ${{ always() && inputs.dry_run != true }}
        env:
          TOPIC: ${{ inputs.topic_id }}
        run: |
          [ -d tools/slides/out ] || exit 0
          mkdir -p /tmp/o && cp -r tools/slides/out/. /tmp/o/
          git config user.name "slides-bot"; git config user.email "slides-bot@users.noreply.github.com"
          if git fetch origin slides-out 2>/dev/null; then git checkout -B slides-out origin/slides-out
          else git checkout --orphan slides-out; git rm -rfq . ; fi
          mkdir -p out && cp -r /tmp/o/. out/
          git add out && git commit -qm "slides output: $TOPIC" && git push -q origin slides-out
