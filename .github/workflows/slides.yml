name: slides
on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: "Mavzu id yoki vergul bilan ro'yxat"
        required: true
      max_usd:
        description: "Bir ishga tushirish byudjeti (USD)"
        default: "0.50"
      dry_run:
        description: "Dry-run (API chaqirilmaydi)"
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  slides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install anthropic python-pptx
      - name: Generate
        working-directory: tools/slides
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOPIC: ${{ inputs.topic_id }}
          MAXUSD: ${{ inputs.max_usd }}
          DRY: ${{ inputs.dry_run }}
        run: |
          FLAG=""; [ "$DRY" = "true" ] && FLAG="--dry-run"
          SRC=""; [ -f sources_private/sources.json ] && SRC="--sources sources_private/sources.json"
          BAD=0
          for T in ${TOPIC//,/ }; do
            echo "=== $T ==="
            python generate.py "$T" --max-usd "$MAXUSD" $SRC $FLAG || { echo "FAIL $T"; BAD=1; }
            if [ -f "out/$T.json" ]; then python build_pptx.py "out/$T.json" || echo "PPTX FAIL $T"; BAD=1; fi
          done
          exit $BAD
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.dry_run != true }}
        with:
          name: slides-${{ inputs.topic_id }}
          path: tools/slides/out/
          if-no-files-found: ignore
      - name: Natijani slides-out branchiga saqlash (maxfiy repo, ilovaga tushmaydi)
        if: ${{ always() && inputs.dry_run != true }}
        env:
          TOPIC: ${{ inputs.topic_id }}
        run: |
          [ -d tools/slides/out ] || exit 0
          mkdir -p /tmp/o/raw && cp tools/slides/out/*.json tools/slides/out/*.pptx /tmp/o/ 2>/dev/null || true
          cp tools/slides/out/raw_*.txt /tmp/o/raw/ 2>/dev/null || true
          git config user.name "slides-bot"; git config user.email "slides-bot@users.noreply.github.com"
          if git fetch origin slides-out 2>/dev/null; then git checkout -B slides-out origin/slides-out
          else git checkout --orphan slides-out; git rm -rfq . ; fi
          mkdir -p out "raw/$GITHUB_RUN_ID"
          cp /tmp/o/*.json /tmp/o/*.pptx out/ 2>/dev/null || true
          cp /tmp/o/raw/* "raw/$GITHUB_RUN_ID/" 2>/dev/null || true
          git add out raw
          git commit -qm "slides output: $TOPIC" || exit 0
          for i in 1 2 3 4 5 6; do
            git push -q origin slides-out && exit 0
            git fetch -q origin slides-out && git rebase origin/slides-out || { git rebase --abort; exit 1; }
            sleep $((RANDOM % 5 + 2))
          done
          exit 1
