name: quiz
on:
  workflow_dispatch:
    inputs:
      topic_id:
        description: "Mavzu id yoki vergul bilan ro'yxat"
        required: true
      max_usd:
        description: "Har bir mavzu uchun byudjet (USD)"
        default: "1.50"
      dry_run:
        description: "Dry-run (API chaqirilmaydi)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: quiz-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install anthropic python-pptx pytest
      - name: Testlar
        run: python -m pytest tools/slides/tests -q
      - name: Mavjud slayd MCQ lari (slides-out/out, dublikat nazorati uchun)
        run: |
          mkdir -p /tmp/so
          if git fetch -q origin slides-out 2>/dev/null; then git archive origin/slides-out out 2>/dev/null | tar -x -C /tmp/so || true; fi
          ls /tmp/so/out 2>/dev/null | head -50 || true
      - name: Generate
        working-directory: tools/slides
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOPIC: ${{ inputs.topic_id }}
          MAXUSD: ${{ inputs.max_usd }}
          DRY: ${{ inputs.dry_run }}
        run: |
          FLAG=""; [ "$DRY" = "true" ] && FLAG="--dry-run"
          SRC=""; [ -f sources_private/sources.json ] && SRC="--sources sources_private/sources.json"
          BAD=0
          for T in ${TOPIC//,/ }; do
            echo "=== $T ==="
            python generate_quiz.py "$T" --max-usd "$MAXUSD" --existing /tmp/so/out $SRC $FLAG || { echo "FAIL $T"; BAD=1; }
          done
          exit $BAD
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.dry_run != true }}
        with:
          name: quiz-${{ inputs.topic_id }}
          path: tools/slides/out_quiz/
          if-no-files-found: ignore
      - name: Natijani slides-out branchidagi quiz/ papkasiga saqlash (maxfiy repo, ilovaga tushmaydi)
        if: ${{ always() && inputs.dry_run != true }}
        env:
          TOPIC: ${{ inputs.topic_id }}
        run: |
          [ -d tools/slides/out_quiz ] || exit 0
          mkdir -p /tmp/o/raw && cp tools/slides/out_quiz/*.json /tmp/o/ 2>/dev/null || true
          cp tools/slides/out_quiz/raw/raw_*.txt /tmp/o/raw/ 2>/dev/null || true
          git config user.name "slides-bot"; git config user.email "slides-bot@users.noreply.github.com"
          if git fetch origin slides-out 2>/dev/null; then git checkout -B slides-out origin/slides-out
          else git checkout --orphan slides-out; git rm -rfq . ; fi
          mkdir -p quiz "raw-quiz/$GITHUB_RUN_ID"
          cp /tmp/o/*.json quiz/ 2>/dev/null || true
          cp /tmp/o/raw/* "raw-quiz/$GITHUB_RUN_ID/" 2>/dev/null || true
          git add quiz raw-quiz
          git commit -qm "quiz output: $TOPIC" || exit 0
          for i in $(seq 1 20); do
            git push -q origin slides-out && exit 0
            git fetch -q origin slides-out && git rebase origin/slides-out || { git rebase --abort; exit 1; }
            sleep $((RANDOM % 20 + 5))
          done
          exit 1
