# Sinov APK’lari uchun GitHub pre-release (xususiy repo — havola faqat
# ruxsati bor foydalanuvchiga ochiladi). `.github/apk-prerelease-tag`
# fayli o‘zgarganda ishlaydi (fayl ichida — teg nomi); teg GitHub tomonida
# joriy commit’ga yaratiladi.
# DEBUG imzoli — store’ga emas; nomida va matnida ochiq yozilgan.
name: Test APK pre-release

on:
  push:
    branches:
      - claude/phase-8-12-final-release
    paths:
      - .github/apk-prerelease-tag

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build APKs (debug-signed test builds)
        working-directory: apps/mobile
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64
          mkdir -p "$RUNNER_TEMP/out"
          V="$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$RUNNER_TEMP/out/forensic-expert-$V-TELEFON-arm64-DEBUG.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "$RUNNER_TEMP/out/forensic-expert-$V-BLUESTACKS-x86_64-DEBUG.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/out/forensic-expert-$V-UNIVERSAL-DEBUG.apk"
          (cd "$RUNNER_TEMP/out" && sha256sum *.apk | tee SHA256SUMS.txt)
      - name: Create pre-release with APK assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(tr -d '[:space:]' < .github/apk-prerelease-tag)"
          case "$TAG" in apk-v*) ;; *) echo "::error::tag must start with apk-v"; exit 1;; esac
          gh release create "$TAG" "$RUNNER_TEMP"/out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Test APK $TAG (DEBUG signed — not for store)" \
            --notes "Real-device test builds. DEBUG SIGNED — NOT FOR STORE. TELEFON = arm64 phones, BLUESTACKS = x86_64 emulator, UNIVERSAL = all ABIs. HUMAN VERIFIED = 0."
