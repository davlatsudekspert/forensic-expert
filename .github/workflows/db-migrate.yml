name: db-migrate
# Repodagi BITTA migratsiya faylini production bazaga qo'llaydi (Supabase
# Management API). Faqat supabase/migrations/ ichidagi fayl; bir marta
# qo'llanganini schema_migrations'ga yozadi va qayta qo'llamaydi.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Kod olinadigan branch"
        default: claude/phase-8-12-final-release
      migration:
        description: "Fayl nomi (masalan 20261018050000_class_groups.sql)"
        required: true
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'igvzlmpgwybjdgkyowrl' }}
      MIG: ${{ inputs.migration }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref }}" }
      - name: Qo'llash
        run: |
          python - <<'PY'
          import json, os, re, sys, urllib.request, pathlib
          ref, tok, mig = os.environ["PROJECT_REF"], os.environ.get("SUPABASE_ACCESS_TOKEN"), os.environ["MIG"]
          if not tok: sys.exit("::error::SUPABASE_ACCESS_TOKEN secret is not set")
          if not re.fullmatch(r"\d{14}_[a-z0-9_]+\.sql", mig): sys.exit("::error::bad migration name")
          path = pathlib.Path("supabase/migrations") / mig
          sql = path.read_text(encoding="utf-8")
          version, name = mig[:14], mig[15:-4]
          def run(q):
              req = urllib.request.Request(f"https://api.supabase.com/v1/projects/{ref}/database/query",
                  data=json.dumps({"query": q}).encode(), method="POST",
                  headers={"Authorization": f"Bearer {tok}", "Content-Type": "application/json", "User-Agent": "forensic-expert-migrate"})
              with urllib.request.urlopen(req, timeout=300) as r:
                  return json.loads(r.read() or b"[]")
          done = run(f"select count(*) n from supabase_migrations.schema_migrations where version = '{version}'")
          if done and done[0]["n"]:
              print("already applied:", mig); sys.exit(0)
          run("begin;\n" + sql + "\n;insert into supabase_migrations.schema_migrations (version, name) values ('"
              + version + "', '" + name + "');\ncommit;")
          print("applied:", mig)
          PY
