- num: 52
  slug: diazotised-sulfanilic-acid
  names: {uz: "Diazotlangan sulfanil kislota", ru: "Сульфаниловая кислота диазотированная", en: "Diazotised sulfanilic acid"}
  synonyms: ["diazotized sulfanilic acid", "диазотированная сульфаниловая кислота"]
  extra_hazards: [hcl_conc]
  ing:
    - [sulfanilic_stock, 5, mL]
    - [nano2, 2.5, mL, {spec: "%:10"}]
    - [nano2, 10, mL, {spec: "%:10"}]
    - [water, 100, mL, {to: true}]
  steps:
    - uz: "100 ml li o‘lchov kolbasiga 5 ml sulfanil kislota eritmasini (500 ml suvda 4,5 g sulfanil kislota va 45 ml konsentrlangan xlorid kislota) soling."
      ru: "В мерную колбу на 100 мл вносят 5 мл раствора сульфаниловой кислоты (4,5 г сульфаниловой кислоты и 45 мл концентрированной соляной кислоты в 500 мл воды)."
      en: "Place 5 mL of sulfanilic acid solution (4.5 g of sulfanilic acid and 45 mL of concentrated hydrochloric acid in 500 mL of water) in a 100 mL volumetric flask."
    - uz: "Kolbani muz bilan soviting va 2,5 ml 10 % li natriy nitrit eritmasini qo‘shing; muzda 5 daqiqa qoldiring."
      ru: "Колбу охлаждают льдом, прибавляют 2,5 мл 10 %-го раствора нитрита натрия и оставляют на льду на 5 мин."
      en: "Cool the flask in ice, add 2.5 mL of 10 % sodium nitrite solution and leave on ice for 5 min."
    - uz: "Yana 10 ml 10 % li natriy nitrit eritmasini qo‘shing, chayqating, muzda 5 daqiqa qoldiring va suv bilan belgigacha yetkazing."
      ru: "Прибавляют ещё 10 мл 10 %-го раствора нитрита натрия, взбалтывают, оставляют на льду 5 мин и доводят водой до метки."
      en: "Add a further 10 mL of 10 % sodium nitrite solution, shake, leave on ice for 5 min and make up to the mark with water."

- num: 53
  slug: copper-sulfate-ammonia-pyridine
  names: {uz: "Mis sulfat (ammiak va piridindagi eritma)", ru: "Сульфат меди (раствор в аммиаке и пиридине)", en: "Copper sulfate in ammonia and pyridine"}
  ing:
    - [cuso4, 10, mL, {spec: "%:3"}]
    - [ammonia, null, null, {spec: "%:25", q: dropwise_dissolve}]
    - [cuso4, null, null, {spec: "%:3", q: several_drops}]
    - [pyridine_fd, null, null, {q: dropwise_dissolve}]
    - [pyridine, null, null, {q: drops_5_8_per_10}]
  steps:
    - uz: "10 ml 3 % li mis sulfat eritmasiga hosil bo‘ladigan cho‘kma to‘liq eriguncha 25 % li ammiak eritmasini tomchilab qo‘shing."
      ru: "К 10 мл 3 %-го раствора сульфата меди по каплям прибавляют 25 %-й раствор аммиака до полного растворения образующегося осадка."
      en: "Add 25 % ammonia solution dropwise to 10 mL of 3 % copper sulfate solution until the precipitate that forms dissolves completely."
    - uz: "Erimaydigan cho‘kma hosil bo‘lguncha yana bir necha tomchi 3 % li mis sulfat eritmasini qo‘shing."
      ru: "Прибавляют ещё несколько капель 3 %-го раствора сульфата меди до получения нерастворимого осадка."
      en: "Add a few more drops of 3 % copper sulfate solution until an insoluble precipitate forms."
    - uz: "Cho‘kma eriguncha yangi haydalgan piridinni tomchilab qo‘shing."
      ru: "По каплям прибавляют свежеперегнанный пиридин до растворения осадка."
      en: "Add freshly distilled pyridine dropwise until the precipitate dissolves."
    - uz: "Eritmaning har 10 ml iga yana 5–8 tomchi piridin qo‘shing."
      ru: "К раствору ещё прибавляют пиридин из расчёта 5–8 капель на каждые 10 мл."
      en: "Add a further 5–8 drops of pyridine per 10 mL of solution."

- num: 54
  slug: mercury-sulfate-solution
