# Ilova egasi to‘plami «Приготовление реактивов» (SRC-OWNER-REAGENTS), 38–74-bandlar.
# Format — recipes_01_37.yaml sarlavhasiga qarang.

- num: 38
  slug: marme
  names: {uz: "Marme reaktivi", ru: "Реактив Марме", en: "Marmé reagent"}
  synonyms: ["Marme", "Marmé", "Марме"]
  ing:
    - [ki, 10, g]
    - [water_hot, 30, mL]
    - [cdi2, 5, g]
    - [ki, null, null, {spec: "sat", q: equal_vol}]
  steps:
    - uz: "30 ml suvda 10 g kaliy yodid saqlovchi issiq eritmada 5 g kadmiy yodidni eriting."
      ru: "В горячем растворе 10 г иодида калия в 30 мл воды растворяют 5 г иодида кадмия."
      en: "Dissolve 5 g of cadmium iodide in a hot solution of 10 g of potassium iodide in 30 mL of water."
    - uz: "Hosil bo‘lgan eritmani teng hajmdagi to‘yingan kaliy yodid eritmasi bilan aralashtiring."
      ru: "Полученный раствор смешивают с равным объёмом насыщенного раствора иодида калия."
      en: "Mix the solution with an equal volume of saturated potassium iodide solution."

- num: 39
  slug: millon
  names: {uz: "Millon reaktivi", ru: "Реактив Миллона", en: "Millon reagent"}
  synonyms: ["Millon", "Millon's reagent", "Миллона", "Миллон"]
  variants:
    - {id: a, uz: "a) simob(I) nitratdan", ru: "а) из нитрата ртути (I)", en: "a) from mercury(I) nitrate"}
    - {id: b, uz: "b) metall simobdan", ru: "б) из металлической ртути", en: "b) from metallic mercury"}
  ing:
    - [hg2no3, 10, g, {v: a}]
    - [hno3_conc, 8.5, mL, {v: a}]
    - [water, null, null, {q: double_vol, v: a}]
    - [hg, 10, g, {v: b}]
    - [hno3_conc, 15, mL, {v: b}]
    - [water, 30, mL, {v: b}]
  steps:
    - v: a
      uz: "10 g simob(I) nitratni 8,5 ml konsentrlangan nitrat kislotada eriting va eritmani ikki baravar hajmdagi suv bilan suyultiring."
      ru: "10 г нитрата ртути (I) растворяют в 8,5 мл концентрированной азотной кислоты и разбавляют двойным объёмом воды."
      en: "Dissolve 10 g of mercury(I) nitrate in 8.5 mL of concentrated nitric acid and dilute with twice the volume of water."
    - v: b
      uz: "10 g metall simobni 15 ml konsentrlangan nitrat kislotada eriting va 30 ml suv qo‘shing."
      ru: "10 г металлической ртути растворяют в 15 мл концентрированной азотной кислоты и прибавляют 30 мл воды."
      en: "Dissolve 10 g of metallic mercury in 15 mL of concentrated nitric acid and add 30 mL of water."
    - v: b
      uz: "Tiniq eritmani quyib oling va reaktiv sifatida ishlating."
      ru: "Прозрачный раствор сливают и применяют как реактив."
      en: "Decant the clear solution and use it as the reagent."
  notes:
    - {kind: info, uz: "Reaktiv — bir va ikki valentli simob nitratlari aralashmasi, nitrit kislota aralashmasini saqlaydi.", ru: "Реактив — смесь нитратов одно- и двухвалентной ртути, содержащая примесь азотистой кислоты.", en: "The reagent is a mixture of mercury(I) and mercury(II) nitrates containing some nitrous acid."}

- num: 40
  slug: nessler
  names: {uz: "Nessler reaktivi", ru: "Реактив Несслера", en: "Nessler reagent"}
  synonyms: ["Nessler", "Nessler's reagent", "Несслера", "Несслер"]
  ing:
    - [ki, 50, g]
    - [water, 50, mL]
    - [hgcl2, null, null, {spec: {uz: "to‘yingan eritma (100 ml suvda 6 g)", ru: "насыщенный раствор (6 г в 100 мл воды)", en: "saturated solution (6 g in 100 mL water)"}, q: until_persistent_ppt}]
    - [koh, 200, mL, {spec: "N:6"}]
    - [water, 500, mL, {to: true}]
  steps:
    - uz: "50 ml suvda 50 g kaliy yodidni eriting."
      ru: "В 50 мл воды растворяют 50 г иодида калия."
      en: "Dissolve 50 g of potassium iodide in 50 mL of water."
    - uz: "Doimiy aralashtirib turib, simob yodidning turg‘un cho‘kmasi paydo bo‘lguncha to‘yingan simob(II) xlorid eritmasini (100 ml suvda 6 g) qo‘shing."
      ru: "При постоянном перемешивании прибавляют насыщенный раствор хлорида ртути (II) (6 г в 100 мл воды) до появления устойчивого осадка иодида ртути."
      en: "With constant stirring add saturated mercury(II) chloride solution (6 g in 100 mL of water) until a persistent precipitate of mercury iodide appears."
    - uz: "200 ml 6 n. kaliy gidroksid eritmasini qo‘shing va suv bilan 500 ml gacha yetkazing."
      ru: "Прибавляют 200 мл 6 н. раствора гидроксида калия и воду до 500 мл."
      en: "Add 200 mL of 6 N potassium hydroxide solution and make up to 500 mL with water."
  storage: {uz: "Qorong‘i joyda saqlanadi.", ru: "Сохраняют в тёмном месте.", en: "Store in the dark."}

- num: 41
  slug: trinder
  names: {uz: "Trinder reaktivi", ru: "Реактив Триндера", en: "Trinder reagent"}
  synonyms: ["Trinder", "Триндера", "Триндер"]
  ing:
    - [hgcl2, 4, g]
    - [water, 85, mL]
    - [hcl, 12, mL, {spec: "N:1"}]
    - [fe_nitrate, 4, g]
    - [water, 100, mL, {to: true}]
  steps:
    - uz: "4 g simob(II) xloridni qizdirib, 85 ml suvda eriting va eritmani soviting."
      ru: "4 г хлорида ртути (II) при нагревании растворяют в 85 мл воды, раствор охлаждают."
      en: "Dissolve 4 g of mercury(II) chloride in 85 mL of water with heating and cool."
    - uz: "12 ml 1 n. xlorid kislota eritmasi va 4 g temir(III) nitrat qo‘shing."
      ru: "Прибавляют 12 мл 1 н. раствора соляной кислоты и 4 г нитрата железа (III)."
      en: "Add 12 mL of 1 N hydrochloric acid and 4 g of iron(III) nitrate."
    - uz: "Temir nitrat erigach, hajmni suv bilan 100 ml gacha yetkazing."
      ru: "После растворения нитрата железа объём доводят водой до 100 мл."
      en: "Once the iron nitrate has dissolved, make up to 100 mL with water."
  flags:
    - {kind: ambiguity, uz: "Asl matnda nom «Триидлера» (OCR xatosi) — «Триндера» (Trinder) deb o‘qildi.", ru: "В исходном тексте «Триидлера» (ошибка распознавания) — прочитано как «Триндера».", en: "The original reads «Триидлера» (OCR error), read as «Триндера» (Trinder)."}

- num: 42
  slug: fehling
  names: {uz: "Feling reaktivi", ru: "Реактив Фелинга", en: "Fehling reagent"}
  synonyms: ["Fehling", "Feling", "Fehling's solution", "Фелинга", "Фелинг"]
  variants:
    - {id: a, uz: "a) A va B eritmalar", ru: "а) растворы А и Б", en: "a) solutions A and B"}
    - {id: b, uz: "b) bitta eritma", ru: "б) один раствор", en: "b) single solution"}
  ing:
    - [cuso4_recryst, 34.66, g, {v: a, role: {uz: "A eritma", ru: "раствор А", en: "solution A"}}]
    - [h2so4_dil, 2, drop, {max: 3, v: a, role: {uz: "A eritma", ru: "раствор А", en: "solution A"}}]
    - [water, 500, mL, {to: true, v: a, role: {uz: "A eritma", ru: "раствор А", en: "solution A"}}]
    - [rochelle, 173, g, {v: a, role: {uz: "B eritma", ru: "раствор Б", en: "solution B"}}]
    - [naoh, 50, g, {v: a, role: {uz: "B eritma", ru: "раствор Б", en: "solution B"}}]
    - [water, 400, mL, {v: a, role: {uz: "B eritma", ru: "раствор Б", en: "solution B"}}]
    - [water, 500, mL, {to: true, v: a, role: {uz: "B eritma", ru: "раствор Б", en: "solution B"}}]
    - [cuso4, 7, g, {v: b}]
    - [water, 100, mL, {v: b}]
    - [naoh, 14, g, {v: b}]
    - [rochelle, 36, g, {v: b}]
    - [water, 100, mL, {v: b}]
  steps:
    - v: a
      uz: "A eritma: 34,66 g qayta kristallangan mis sulfatni 2–3 tomchi suyultirilgan sulfat kislota bilan kislotalangan suvda eriting va suv bilan 500 ml gacha yetkazing."
      ru: "Раствор А: 34,66 г перекристаллизованного сульфата меди растворяют в воде, подкисленной 2–3 каплями разбавленной серной кислоты, и доводят водой до 500 мл."
      en: "Solution A: dissolve 34.66 g of recrystallised copper sulfate in water acidified with 2–3 drops of dilute sulfuric acid and make up to 500 mL with water."
    - v: a
      uz: "B eritma: 173 g segnet tuziga 50 g natriy gidroksid qo‘shing, 400 ml suvda eriting va suv bilan 500 ml gacha yetkazing."
      ru: "Раствор Б: к 173 г сегнетовой соли прибавляют 50 г гидроксида натрия, растворяют в 400 мл воды и доводят водой до 500 мл."
      en: "Solution B: add 50 g of sodium hydroxide to 173 g of Rochelle salt, dissolve in 400 mL of water and make up to 500 mL."
    - v: a
      uz: "Ishlatishdan oldin A va B eritmalarni teng hajmda aralashtiring."
      ru: "Перед употреблением смешивают равные объёмы растворов А и Б."
      en: "Mix equal volumes of solutions A and B before use."
    - v: b
      uz: "100 ml suvda 7 g mis sulfatni eriting va unga 100 ml suvda 14 g natriy gidroksid va 36 g segnet tuzi saqlovchi eritmani qo‘shing."
      ru: "7 г сульфата меди растворяют в 100 мл воды и прибавляют раствор 14 г гидроксида натрия и 36 г сегнетовой соли в 100 мл воды."
      en: "Dissolve 7 g of copper sulfate in 100 mL of water and add a solution of 14 g of sodium hydroxide and 36 g of Rochelle salt in 100 mL of water."

- num: 43
  slug: folin-ciocalteu
  names: {uz: "Folin–Chiokalteu reaktivi", ru: "Реактив Фолина — Чиокальто", en: "Folin–Ciocalteu reagent"}
  synonyms: ["Folin-Ciocalteu", "Folin Ciocalteu", "Folin", "Фолина", "Фолина-Чиокальто", "Чиокальто"]
  ing:
    - [na2wo4, 100, g, {role: {uz: "A eritma", ru: "раствор А", en: "solution A"}}]
    - [water, null, null, {q: dissolve, role: {uz: "A eritma", ru: "раствор А", en: "solution A"}}]
    - [na2moo4, 25, g, {role: {uz: "B eritma", ru: "раствор Б", en: "solution B"}}]
    - [water, null, null, {q: dissolve, role: {uz: "B eritma", ru: "раствор Б", en: "solution B"}}]
    - [water, 700, mL, {to: true}]
    - [h3po4, 50, mL, {spec: "%:85"}]
    - [hcl_conc, 100, mL]
    - [li2so4, 150, g]
    - [water_dist, 50, mL]
    - [bromine, 3, drop, {max: 5}]
    - [water, 1000, mL, {to: true}]
  steps:
    - uz: "100 g natriy volframatga eriguncha suv qo‘shing (A eritma). 25 g natriy molibdatga ham eriguncha suv qo‘shing (B eritma)."
      ru: "К 100 г вольфрамата натрия прибавляют воду до растворения (раствор А). К 25 г молибдата натрия также прибавляют воду до растворения (раствор Б)."
      en: "Add water to 100 g of sodium tungstate until dissolved (solution A). Likewise add water to 25 g of sodium molybdate until dissolved (solution B)."
    - uz: "A va B eritmalarni aralashtiring va suv bilan 700 ml gacha yetkazing."
      ru: "Растворы А и Б смешивают и прибавляют воду до 700 мл."
      en: "Mix solutions A and B and make up to 700 mL with water."
    - uz: "Suyuqlikni 1500 ml li kolbaga o‘tkazing, 50 ml 85 % li fosfat kislota va 100 ml konsentrlangan xlorid kislota qo‘shing."
      ru: "Жидкость переносят в колбу вместимостью 1500 мл, прибавляют 50 мл 85 %-й фосфорной кислоты и 100 мл концентрированной соляной кислоты."
      en: "Transfer to a 1500 mL flask; add 50 mL of 85 % phosphoric acid and 100 mL of concentrated hydrochloric acid."
    - uz: "Kolbani qaytarma sovitgichli tiqin bilan yoping va 10 soat uzluksiz qaynating."
      ru: "Колбу закрывают пробкой с обратным холодильником и непрерывно кипятят 10 ч."
      en: "Fit the flask with a reflux condenser and boil continuously for 10 h."
    - uz: "Sovigach, 150 g litiy sulfat, 50 ml distillangan suv va 3–5 tomchi brom qo‘shing."
      ru: "После охлаждения прибавляют 150 г сульфата лития, 50 мл дистиллированной воды и 3–5 капель брома."
      en: "After cooling, add 150 g of lithium sulfate, 50 mL of distilled water and 3–5 drops of bromine."
    - uz: "Ortiqcha bromni yo‘qotish uchun suyuqlikni sovitgichsiz 15 daqiqa qaynating."
      ru: "Жидкость кипятят без холодильника 15 мин (для удаления избытка брома)."
      en: "Boil without the condenser for 15 min to remove excess bromine."
    - uz: "Sovigach, kolbaga o‘tkazing, suv bilan 1000 ml gacha yetkazing, yaxshilab chayqating va filtrlang."
      ru: "После охлаждения переносят в колбу, доводят водой до 1000 мл, хорошо взбалтывают и фильтруют."
      en: "After cooling, transfer to a flask, make up to 1000 mL with water, shake well and filter."
    - uz: "Filtratni shlifli tiqinli qorong‘i shisha idishga yig‘ing. Ishlatishdan oldin reaktivni suv bilan (1:3) suyultiring."
      ru: "Фильтрат собирают в склянку из тёмного стекла с притёртой пробкой. Перед употреблением реактив разбавляют водой (1:3)."
      en: "Collect the filtrate in a dark-glass bottle with a ground-glass stopper. Dilute the reagent with water (1:3) before use."
  storage: {uz: "Sovuq joyda saqlanadi.", ru: "Сохраняют в холодном месте.", en: "Store in a cold place."}
  stability: {uz: "Bir necha oy davomida yaroqli.", ru: "Пригоден к употреблению в течение нескольких месяцев.", en: "Usable for several months."}
  flags:
    - {kind: ambiguity, uz: "Asl matnda B eritma uchun «прибавляют иоду до растворения» yozilgan — bu «воду» (suv) so‘zining OCR xatosi deb o‘qildi; tekshiring.", ru: "В исходном тексте для раствора Б написано «прибавляют иоду до растворения» — прочитано как «воду» (ошибка распознавания); проверьте.", en: "For solution B the original reads «прибавляют иоду» (add iodine); read as «воду» (water), an OCR error — please verify."}

- num: 44
  slug: forrest
  names: {uz: "Forrest reaktivi", ru: "Реактив Форреста", en: "Forrest reagent"}
  synonyms: ["Forrest", "Форреста", "Форрест"]
  ing:
    - [k2cr2o7, 25, mL, {spec: "%:0.2"}]
    - [h2so4, 25, mL, {spec: "%:30"}]
    - [hclo4, 25, mL, {spec: "%:20"}]
    - [hno3, 25, mL, {spec: "%:50"}]
  steps:
    - uz: "25 ml 0,2 % li kaliy dixromat eritmasini 25 ml 30 % li sulfat kislota eritmasi bilan aralashtiring."
      ru: "Смешивают 25 мл 0,2 %-го раствора дихромата калия с 25 мл 30 %-го раствора серной кислоты."
      en: "Mix 25 mL of 0.2 % potassium dichromate solution with 25 mL of 30 % sulfuric acid."
    - uz: "25 ml 20 % li perxlorat kislota (HClO₄) va 25 ml 50 % li nitrat kislota eritmasini qo‘shing."
      ru: "Прибавляют 25 мл 20 %-го раствора хлорной кислоты (HClO₄) и 25 мл 50 %-го раствора азотной кислоты."
      en: "Add 25 mL of 20 % perchloric acid (HClO₄) and 25 mL of 50 % nitric acid."

- num: 45
  slug: fpn
  names: {uz: "FPN reaktivi", ru: "Реактив ФПН", en: "FPN reagent"}
  synonyms: ["FPN", "ФПН", "ferric perchloric nitric"]
  ing:
    - [fecl3, 5, mL, {spec: "%:5"}]
    - [hclo4, 45, mL, {spec: "%:20"}]
    - [hno3, 50, mL, {spec: "%:50"}]
  steps:
    - uz: "5 ml 5 % li temir(III) xlorid eritmasiga 45 ml 20 % li perxlorat kislota va 50 ml 50 % li nitrat kislota eritmasini qo‘shing."
      ru: "К 5 мл 5 %-го раствора хлорида железа (III) прибавляют 45 мл 20 %-го раствора хлорной кислоты и 50 мл 50 %-го раствора азотной кислоты."
      en: "To 5 mL of 5 % iron(III) chloride solution add 45 mL of 20 % perchloric acid and 50 mL of 50 % nitric acid."

- num: 46
  slug: frohde
  names: {uz: "Frede reaktivi", ru: "Реактив Фреде", en: "Fröhde reagent"}
  synonyms: ["Frohde", "Fröhde", "Froehde", "Frede", "Фреде"]
  ing:
    - [nh4_or_na_moo4, null, null, {q: as_needed}]
    - [h2so4_conc, null, null, {q: as_needed}]
  steps:
    - uz: "Kukun holiga keltirilgan ammoniy (yoki natriy) molibdatga konsentrlangan sulfat kislota qo‘shing va kuchli chayqating."
      ru: "К растёртому в порошок молибдату аммония (или натрия) прибавляют концентрированную серную кислоту и интенсивно взбалтывают."
      en: "Add concentrated sulfuric acid to powdered ammonium (or sodium) molybdate and shake vigorously."
    - uz: "Molibden kislotaning konsentrlangan sulfat kislotadagi to‘yingan eritmasini cho‘kmadan quyib oling."
      ru: "Насыщенный раствор молибденовой кислоты в концентрированной серной кислоте сливают с осадка."
      en: "Decant the saturated solution of molybdic acid in concentrated sulfuric acid from the sediment."
  stability: {uz: "Yangi tayyorlangan holda ishlatiladi; turib qolganda rangi o‘zgarishi mumkin.", ru: "Используют свежеприготовленным; при стоянии может изменять окраску.", en: "Use freshly prepared; the colour may change on standing."}
  flags:
    - {kind: ambiguity, uz: "Miqdorlar manbada berilmagan (to‘yingan eritma tayyorlanadi).", ru: "Количества в источнике не указаны (готовят насыщенный раствор).", en: "The source gives no amounts (a saturated solution is prepared)."}

