  steps:
    - uz: "4 g natriy bromidga 0,1 g mis xlorid va 5,9 ml suv qo‘shing."
      ru: "К 4 г бромида натрия прибавляют 0,1 г хлорида меди и 5,9 мл воды."
      en: "To 4 g of sodium bromide add 0.1 g of copper chloride and 5.9 mL of water."

- num: 66
  slug: bromophenol-blue-silver-nitrate
  names: {uz: "Bromfenol ko‘ki (kumush nitrat saqlovchi eritma)", ru: "Бромфеноловый синий (раствор, содержащий нитрат серебра)", en: "Bromophenol blue solution containing silver nitrate"}
  ing:
    - [bpb, 10, mL, {spec: "acetone%:0.5"}]
    - [agno3, 90, mL, {spec: {uz: "0,5 % li suv–aseton (1:3) eritmasi", ru: "0,5 %-й раствор в смеси воды и ацетона (1:3)", en: "0.5 % solution in water–acetone (1:3)"}}]
  extra_hazards: [acetone]
  steps:
    - uz: "Bromfenol ko‘kining asetondagi 0,5 % li eritmasidan 10 ml ga kumush nitratning suv–aseton (1:3) aralashmasidagi 0,5 % li eritmasidan 90 ml qo‘shing."
      ru: "К 10 мл 0,5 %-го раствора бромфенолового синего в ацетоне прибавляют 90 мл 0,5 %-го раствора нитрата серебра в смеси воды и ацетона (1:3)."
      en: "To 10 mL of 0.5 % bromophenol blue in acetone add 90 mL of 0.5 % silver nitrate in water–acetone (1:3)."
  storage: {uz: "Qorong‘i joyda saqlanadi.", ru: "Сохраняют в тёмном месте.", en: "Store in the dark."}
  stability: {uz: "Tayyorlangandan keyin 15 sutka davomida yaroqli.", ru: "Пригоден к употреблению в течение 15 сут после приготовления.", en: "Usable for 15 days after preparation."}

- num: 67
  slug: ethylmercury-chloride-dithizonate
  names: {uz: "Etilsimob xlorid ditizonati (xloroformdagi eritma)", ru: "Дитизонат этилмеркурхлорида (хлороформный раствор)", en: "Ethylmercury chloride dithizonate (chloroform solution)"}
  synonyms: ["granosan", "гранозан"]
  extra_hazards: [chloroform]
  ing:
    - [etHgCl_soln, 10, mL, {spec: "%:0.05"}]
    - [acetate_buffer, 20, mL]
    - [water, 10, mL]
    - [dithizone_soln, 1, mL, {spec: "%:0.01"}]
    - [dithizone_soln, 1, mL, {spec: "%:0.01", q: per_portion_repeat}]
    - [chloroform, 0.5, mL]
  steps:
    - uz: "Ajratgich voronkaga etilsimob xloridning 0,05 % li xloroformdagi eritmasidan 10 ml, 20 ml atsetat bufer aralashmasi (pH 4,5), 10 ml suv va ditizonning 0,01 % li xloroformdagi eritmasidan 1 ml soling."
      ru: "В делительную воронку вносят 10 мл 0,05 %-го хлороформного раствора этилмеркурхлорида, 20 мл ацетатной буферной смеси (pH 4,5), 10 мл воды и 1 мл 0,01 %-го хлороформного раствора дитизона."
      en: "Place in a separatory funnel 10 mL of 0.05 % ethylmercury chloride in chloroform, 20 mL of acetate buffer (pH 4.5), 10 mL of water and 1 mL of 0.01 % dithizone in chloroform."
    - uz: "2–3 daqiqa chayqating va xloroform qatlamini ajrating."
      ru: "Взбалтывают 2–3 мин и отделяют хлороформный слой."
      en: "Shake for 2–3 min and separate the chloroform layer."
    - uz: "Suvli fazani oxirgi ulush rangi yashildan sariqqa o‘zgarmay qolguncha 0,01 % li ditizon eritmasining yangi ulushlari (har biri 1 ml) bilan yana chayqating."
      ru: "Водную фазу ещё взбалтывают с новыми порциями 0,01 %-го раствора дитизона (по 1 мл), пока последняя порция не перестанет изменять окраску из зелёной в жёлтую."
      en: "Shake the aqueous phase again with fresh 1 mL portions of 0.01 % dithizone until the last portion no longer changes from green to yellow."
    - uz: "Xloroformli ekstraktlarni birlashtiring va sovuq havo oqimida quruq qoldiqqacha bug‘lating; qoldiqni 0,5 ml xloroformda eriting."
      ru: "Хлороформные вытяжки соединяют и выпаривают досуха в струе холодного воздуха; сухой остаток растворяют в 0,5 мл хлороформа."
      en: "Combine the chloroform extracts and evaporate to dryness in a stream of cold air; dissolve the residue in 0.5 mL of chloroform."
  notes:
    - {kind: purpose, uz: "Granozanni xromatografik aniqlashda «guvoh» (taqqoslash) eritmasi sifatida ishlatiladi.", ru: "Используют как раствор «свидетеля» при хроматографическом определении гранозана.", en: "Used as the reference («witness») solution in the chromatographic determination of granosan."}

- num: 68
  slug: organophosphorus-indicator-mixture
  names: {uz: "Fosfororganik birikmalarni aniqlash uchun indikator aralashmasi", ru: "Индикаторная смесь для обнаружения органических соединений фосфора", en: "Indicator mixture for detecting organophosphorus compounds"}
  synonyms: ["organophosphate indicator", "ФОС индикатор"]
  ing:
    - [horse_serum, 5, mL]
    - [water, 15, mL]
    - [naoh, 0.5, mL, {spec: "N:0.1"}]
    - [btb, 1.25, mL, {spec: {uz: "0,6 % li eritma (0,1 n. natriy gidroksidda)", ru: "0,6 %-й раствор в 0,1 н. растворе гидроксида натрия", en: "0.6 % solution in 0.1 N sodium hydroxide"}}]
  steps:
    - uz: "5 ml ot qon zardobiga 15 ml suv, 0,5 ml 0,1 n. natriy gidroksid eritmasi va bromtimol ko‘kining 0,1 n. natriy gidroksiddagi 0,6 % li eritmasidan 1,25 ml qo‘shing."
      ru: "К 5 мл лошадиной сыворотки прибавляют 15 мл воды, 0,5 мл 0,1 н. раствора гидроксида натрия и 1,25 мл 0,6 %-го раствора бромтимолового синего в 0,1 н. растворе гидроксида натрия."
      en: "To 5 mL of horse serum add 15 mL of water, 0.5 mL of 0.1 N sodium hydroxide and 1.25 mL of 0.6 % bromothymol blue in 0.1 N sodium hydroxide."
  notes:
    - {kind: purpose, uz: "Fosfororganik birikmalarni aniqlash uchun.", ru: "Для обнаружения органических соединений фосфора.", en: "For detecting organophosphorus compounds."}
  flags:
    - {kind: ambiguity, uz: "Asl matnda «0,1 и.» — «0,1 n.» (normal) deb o‘qildi (OCR xatosi).", ru: "В исходном тексте «0,1 и.» — прочитано как «0,1 н.» (ошибка распознавания).", en: "The original reads «0,1 и.», read as «0.1 N» (OCR error)."}

- num: 69
  slug: iodine-in-potassium-iodide
  names: {uz: "Yodning kaliy yodiddagi eritmasi", ru: "Иод (раствор в иодиде калия)", en: "Iodine in potassium iodide solution"}
  synonyms: ["iodine solution", "раствор иода"]
  ing:
    - [ki, 3, g]
    - [water, 4, mL]
    - [iodine_subl, 0.25, g]
    - [water, 100, mL, {to: true}]
  steps:
    - uz: "3 g kaliy yodidni 4 ml suvda eriting va 0,25 g sublimatlangan yod qo‘shing."
      ru: "3 г иодида калия растворяют в 4 мл воды и прибавляют 0,25 г сублимированного иода."
      en: "Dissolve 3 g of potassium iodide in 4 mL of water and add 0.25 g of sublimed iodine."
    - uz: "Yod eriguncha chayqating, so‘ng suv bilan 100 ml gacha yetkazing."
      ru: "Взбалтывают до растворения иода, затем прибавляют воду до 100 мл."
      en: "Shake until the iodine dissolves, then make up to 100 mL with water."

- num: 70
  slug: ammonium-molybdate-solution
  names: {uz: "Ammoniy molibdat eritmasi", ru: "Молибдат аммония (раствор)", en: "Ammonium molybdate solution"}
  ing:
    - [nh4_moo4, 5, g]
    - [water, 100, mL]
    - [hno3_conc, null, null, {q: dropwise_dissolve_white}]
  steps:
    - uz: "5 g ammoniy molibdatni 100 ml suvda eriting."
      ru: "5 г молибдата аммония растворяют в 100 мл воды."
      en: "Dissolve 5 g of ammonium molybdate in 100 mL of water."
    - uz: "Hosil bo‘ladigan oq cho‘kma eriguncha konsentrlangan nitrat kislotani tomchilab qo‘shing."
      ru: "По каплям прибавляют концентрированную азотную кислоту, пока не растворится выделяющийся белый осадок."
      en: "Add concentrated nitric acid dropwise until the white precipitate that forms dissolves."

- num: 71
  slug: alkaline-hydrogen-peroxide
  names: {uz: "Ishqorli vodorod peroksid", ru: "Пероксид водорода в смеси со щёлочью", en: "Alkaline hydrogen peroxide"}
  ing:
    - [naoh, 3, mL, {spec: "aq%:0.5"}]
    - [h2o2, 2, mL, {spec: "%:3"}]
  steps:
    - uz: "3 ml 0,5 % li natriy gidroksid suvli eritmasiga 2 ml 3 % li vodorod peroksid eritmasini qo‘shing."
      ru: "К 3 мл 0,5 %-го водного раствора гидроксида натрия прибавляют 2 мл 3 %-го раствора пероксида водорода."
      en: "Add 2 mL of 3 % hydrogen peroxide to 3 mL of 0.5 % aqueous sodium hydroxide."

- num: 72
  slug: copper-sulfate-sulfite-bicarbonate
  names: {uz: "Mis sulfat, natriy sulfit va natriy gidrokarbonat aralashmasi (eritma)", ru: "Смесь сульфата меди, сульфита натрия и гидрокарбоната натрия (раствор)", en: "Copper sulfate, sodium sulfite and sodium hydrogen carbonate mixture (solution)"}
  ing:
    - [cuso4, 10, mL, {spec: "%:10"}]
    - [na2so3, 20, mL, {spec: "%:30"}]
    - [nahco3, 15, mL, {spec: "%:8"}]
  steps:
    - uz: "10 % li mis(II) sulfat, 30 % li natriy sulfit va 8 % li natriy gidrokarbonat eritmalarini tayyorlang."
      ru: "Готовят 10 %-й раствор сульфата меди (II), 30 %-й раствор сульфита натрия и 8 %-й раствор гидрокарбоната натрия."
      en: "Prepare 10 % copper(II) sulfate, 30 % sodium sulfite and 8 % sodium hydrogen carbonate solutions."
    - uz: "10 ml mis(II) sulfat, 20 ml natriy sulfit va 15 ml natriy gidrokarbonat eritmalarini aralashtiring."
      ru: "Смешивают 10 мл раствора сульфата меди (II), 20 мл раствора сульфита натрия и 15 мл раствора гидрокарбоната натрия."
      en: "Mix 10 mL of the copper(II) sulfate, 20 mL of the sodium sulfite and 15 mL of the sodium hydrogen carbonate solution."

- num: 73
  slug: ammonium-sulfide-solution
  names: {uz: "Ammoniy sulfid eritmasi", ru: "Сульфид аммония (раствор)", en: "Ammonium sulfide solution"}
  ing:
    - [nh4oh, 60, mL, {spec: "N:2"}]
    - [h2s, null, null, {q: stream_15_20}]
    - [nh4oh, 40, mL, {spec: "N:2"}]
  steps:
    - uz: "60 ml 2 n. ammoniy gidroksid eritmasi orqali 15–20 daqiqa vodorod sulfid o‘tkazing."
      ru: "Через 60 мл 2 н. раствора гидроксида аммония в течение 15–20 мин пропускают сероводород."
      en: "Pass hydrogen sulfide through 60 mL of 2 N ammonium hydroxide for 15–20 min."
    - uz: "So‘ng yana 40 ml 2 n. ammoniy gidroksid eritmasini qo‘shing."
      ru: "Затем прибавляют ещё 40 мл 2 н. раствора гидроксида аммония."
      en: "Then add a further 40 mL of 2 N ammonium hydroxide."

- num: 74
  slug: phosphate-buffer-ph-7-38
  names: {uz: "Fosfat bufer eritmasi (pH 7,38)", ru: "Фосфатный буферный раствор (pH 7,38)", en: "Phosphate buffer solution (pH 7.38)"}
  synonyms: ["phosphate buffer", "фосфатный буфер", "fosfat bufer"]
  ing:
    - [na2hpo4, 11.876, g, {role: {uz: "1-eritma (1 l da)", ru: "раствор 1 (на 1 л)", en: "solution 1 (per 1 L)"}}]
    - [water_dist, 1, L, {role: {uz: "1-eritma (1 l da)", ru: "раствор 1 (на 1 л)", en: "solution 1 (per 1 L)"}}]
    - [kh2po4, 9.078, g, {role: {uz: "2-eritma (1 l da)", ru: "раствор 2 (на 1 л)", en: "solution 2 (per 1 L)"}}]
    - [water_dist, 1, L, {role: {uz: "2-eritma (1 l da)", ru: "раствор 2 (на 1 л)", en: "solution 2 (per 1 L)"}}]
    - [na2hpo4, 20, mL, {spec: {uz: "1-eritma", ru: "раствор 1", en: "solution 1"}}]
    - [kh2po4, 5, mL, {spec: {uz: "2-eritma", ru: "раствор 2", en: "solution 2"}}]
    - [water_dist, 500, mL, {to: true}]
  steps:
    - uz: "Bir kolbada 1 litr distillangan suvda 11,876 g natriy gidrofosfatni, boshqasida 1 litr distillangan suvda 9,078 g kaliy digidrofosfatni eriting."
      ru: "В одной колбе в литре дистиллированной воды растворяют 11,876 г моногидрофосфата натрия, в другой — 9,078 г дигидрофосфата калия в одном литре дистиллированной воды."
      en: "In one flask dissolve 11.876 g of disodium hydrogen phosphate in 1 L of distilled water; in another dissolve 9.078 g of potassium dihydrogen phosphate in 1 L of distilled water."
    - uz: "500 ml li o‘lchov kolbasiga natriy gidrofosfat eritmasidan 20 ml va kaliy digidrofosfat eritmasidan 5 ml soling va distillangan suv bilan belgigacha yetkazing."
      ru: "В мерную колбу на 500 мл вносят 20 мл раствора моногидрофосфата натрия и 5 мл раствора дигидрофосфата калия и доводят дистиллированной водой до метки."
      en: "Place 20 mL of the disodium hydrogen phosphate solution and 5 mL of the potassium dihydrogen phosphate solution in a 500 mL volumetric flask and make up to the mark with distilled water."
