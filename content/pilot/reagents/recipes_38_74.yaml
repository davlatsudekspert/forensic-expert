      en: "Mix 1 g of cobalt(II) nitrate and 4 g of potassium thiocyanate and dissolve the mixture in 20 mL of water."

- num: 50
  slug: sulfurous-acid
  names: {uz: "Sulfit kislota eritmasi", ru: "Сернистая кислота (раствор)", en: "Sulfurous acid solution"}
  extra_hazards: [h2so4]
  ing:
    - [water_cold, null, null, {q: as_needed}]
    - [so2, null, null, {q: stream}]
    - [h2so4, null, null, {q: so2_generation}]
    - [na2so3, null, null, {q: so2_generation}]
    - [water, null, null, {q: dilute_5_10}]
  steps:
    - uz: "Sovuq suv orqali oltingugurt(IV) oksid oqimini o‘tkazing; gaz maxsus apparatda sulfat kislota bilan natriy sulfitning o‘zaro ta’siridan olinadi."
      ru: "Через холодную воду пропускают ток оксида серы (IV), получаемого в специальном аппарате взаимодействием серной кислоты с сульфитом натрия."
      en: "Pass a stream of sulfur(IV) oxide through cold water; the gas is generated in a special apparatus from sulfuric acid and sodium sulfite."
    - uz: "Hosil bo‘lgan eritmani suv bilan 5–10 marta suyultiring va reaktiv sifatida ishlating."
      ru: "Полученный раствор разбавляют водой в 5–10 раз и применяют как реактив."
      en: "Dilute the solution 5–10 times with water and use it as the reagent."
  stability: {uz: "Sulfit kislota beqaror — bevosita ishlatishdan oldin tayyorlanadi.", ru: "Сернистая кислота малоустойчива — её готовят непосредственно перед употреблением.", en: "Sulfurous acid is unstable — prepare immediately before use."}
  flags:
    - {kind: ambiguity, uz: "Miqdorlar manbada berilmagan.", ru: "Количества в источнике не указаны.", en: "The source gives no amounts."}

