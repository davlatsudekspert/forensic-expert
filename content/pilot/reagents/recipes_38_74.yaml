      en: "Add 10 drops of 15 % nitric acid to 20 mL of concentrated sulfuric acid and shake."

- num: 49
  slug: cobalt-thiocyanate
  names: {uz: "Kobalt rodanid eritmasi", ru: "Роданид кобальта (раствор)", en: "Cobalt thiocyanate solution"}
  synonyms: ["cobalt thiocyanate", "роданид кобальта", "кобальт тиоцианат"]
