      en: "Add 10 mL of 25 % phosphoric acid to 20 mL of 25 % sodium tungstate solution and mix well."

- num: 48
  slug: erdmann
  names: {uz: "Erdman reaktivi", ru: "Реактив Эрдмана", en: "Erdmann reagent"}
  synonyms: ["Erdmann", "Erdman", "Эрдмана", "Эрдман"]
  ing:
    - [h2so4_conc, 20, mL]
    - [hno3, 10, drop, {spec: "%:15"}]
  steps:
    - uz: "20 ml konsentrlangan sulfat kislotaga 10 tomchi 15 % li nitrat kislota qo‘shing va chayqating."
