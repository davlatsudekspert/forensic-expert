- num: 56
  slug: fuchsin-sulfurous-acid
  names: {uz: "Fuksinsulfit kislota eritmasi", ru: "Фуксинсернистая кислота (раствор)", en: "Fuchsin–sulfurous acid solution"}
  synonyms: ["Schiff", "Schiff reagent", "fuchsin sulfurous acid", "фуксинсернистая кислота", "Шиффа"]
  variants:
    - {id: a, uz: "a) natriy sulfit bilan", ru: "а) с сульфитом натрия", en: "a) with sodium sulfite"}
    - {id: b, uz: "b) oltingugurt(IV) oksid bilan", ru: "б) с оксидом серы (IV)", en: "b) with sulfur(IV) oxide"}
  ing:
    - [fuchsin, 0.2, g, {v: a}]
    - [water_hot, 120, mL, {v: a}]
    - [na2so3_anh, 6, g, {v: a}]
    - [water, 20, mL, {v: a}]
    - [hcl, 4, mL, {spec: "d:1.18", v: a}]
    - [water, 200, mL, {to: true, v: a}]
    - [fuchsin_soln, null, null, {spec: "%:0.1", q: as_needed, v: b}]
    - [so2, null, null, {q: until_decolourised, v: b}]
  steps:
    - v: a
      uz: "0,2 g kimyoviy toza asosli fuksinni 120 ml issiq suvda eriting."
      ru: "0,2 г химически чистого основного фуксина растворяют в 120 мл горячей воды."
      en: "Dissolve 0.2 g of chemically pure basic fuchsin in 120 mL of hot water."
    - v: a
      uz: "Sovigach, 20 ml suvda eritilgan 6 g suvsiz natriy sulfit va 4 ml xlorid kislota (zichligi 1,18) qo‘shing."
      ru: "После охлаждения прибавляют 6 г безводного сульфита натрия, растворённого в 20 мл воды, и 4 мл соляной кислоты (пл. 1,18)."
      en: "After cooling, add 6 g of anhydrous sodium sulfite dissolved in 20 mL of water and 4 mL of hydrochloric acid (density 1.18)."
    - v: a
      uz: "Suv bilan 200 ml gacha yetkazing, filtrlang va filtratni shlifli tiqinli qorong‘i shisha idishga o‘tkazing. Reaktiv rangsiz yoki och sarg‘ish bo‘lishi kerak."
      ru: "Доводят водой до 200 мл, фильтруют и переносят в склянку из тёмного стекла с притёртой пробкой. Реактив должен быть бесцветным или слабо-желтоватым."
      en: "Make up to 200 mL with water, filter and transfer to a dark-glass bottle with a ground-glass stopper. The reagent must be colourless or faintly yellowish."
    - v: b
      uz: "0,1 % li fuksin eritmasi orqali suyuqlik rangsizlanguncha oltingugurt(IV) oksid oqimini o‘tkazing."
      ru: "Через 0,1 %-й раствор фуксина пропускают ток оксида серы (IV) до обесцвечивания жидкости."
      en: "Pass a stream of sulfur(IV) oxide through 0.1 % fuchsin solution until the liquid is decolourised."

