    - {kind: ambiguity, uz: "Asl matnda nom «Маиделина» (OCR xatosi) — «Манделина» deb o‘qildi.", ru: "В исходном тексте «Маиделина» (ошибка распознавания) — прочитано как «Манделина».", en: "The original reads «Маиделина» (OCR error), read as «Манделина» (Mandelin)."}
