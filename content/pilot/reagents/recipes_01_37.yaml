- num: 31
  slug: griess
  names: {uz: "Griss reaktivi", ru: "Реактив Грисса", en: "Griess reagent"}
  synonyms: ["Griess", "Griss", "Грисса", "Грисс"]
  ing:
    - [sulfanilic, null, null, {spec: "ac30%:1", q: equal_vol, role: {uz: "A eritma", ru: "раствор А", en: "solution A"}}]
    - [naphthylamine_a, null, null, {spec: "ac30%:0.1", q: equal_vol, role: {uz: "B eritma", ru: "раствор Б", en: "solution B"}}]
  extra_hazards: [acetic_acid]
  steps:
    - uz: "Ikki eritma tayyorlang: A — sulfanil kislotaning 30 % li sirka kislotadagi 1 % li eritmasi; B — α-naftilaminning 30 % li sirka kislotadagi 0,1 % li eritmasi."
      ru: "Готовят два раствора: А — 1 %-й раствор сульфаниловой кислоты в 30 %-м растворе уксусной кислоты; Б — 0,1 %-й раствор α-нафтиламина в 30 %-м растворе уксусной кислоты."
      en: "Prepare two solutions: A — 1 % sulfanilic acid in 30 % acetic acid; B — 0.1 % α-naphthylamine in 30 % acetic acid."
    - uz: "Ishlatishdan oldin A va B eritmalarni teng hajmda aralashtiring."
      ru: "Перед употреблением смешивают равные объёмы растворов А и Б."
      en: "Mix equal volumes of solutions A and B before use."
  notes:
    - {kind: purpose, uz: "Nitritlarni aniqlash uchun qo‘llaniladi.", ru: "Применяется для обнаружения нитритов.", en: "Used for detecting nitrites."}

- num: 32
  slug: dragendorff
  merge: reagent-dragendorff
  names: {uz: "Dragendorf reaktivi", ru: "Реактив Драгендорфа", en: "Dragendorff reagent"}
  synonyms: ["Dragendorff", "Dragendorf", "Dragendorff's reagent", "Драгендорфа", "Драгендорф", "Драгендорфа реактив"]
  ing:
    - [bi_subnitrate, 8, g]
    - [hno3, 20, mL, {spec: "d:1.18"}]
    - [ki, 27.2, g]
    - [water, 30, mL]
    - [water, 100, mL, {to: true}]
  steps:
    - uz: "20 ml nitrat kislotada (zichligi 1,18) 8 g asosli vismut nitratni eriting."
      ru: "В 20 мл азотной кислоты (пл. 1,18) растворяют 8 г основного нитрата висмута."
      en: "Dissolve 8 g of basic bismuth nitrate in 20 mL of nitric acid (density 1.18)."
    - uz: "Hosil bo‘lgan eritmani 30 ml suvda 27,2 g kaliy yodid saqlovchi eritmaga quying."
      ru: "Полученный раствор вливают в раствор 27,2 г иодида калия в 30 мл воды."
      en: "Pour the solution into a solution of 27.2 g of potassium iodide in 30 mL of water."
    - uz: "Bir necha kundan keyin suyuqlikni filtrlang va suv bilan 100 ml gacha suyultiring."
      ru: "Через несколько дней жидкость фильтруют и разбавляют водой до 100 мл."
      en: "After several days filter the liquid and dilute to 100 mL with water."

- num: 33
  slug: dragendorff-munier
  names: {uz: "Dragendorf reaktivi (Myunye modifikatsiyasi)", ru: "Реактив Драгендорфа, модифицированный по Мунье", en: "Dragendorff reagent, Munier modification"}
  synonyms: ["Dragendorff Munier", "Dragendorf Munye", "Munier", "Мунье", "Драгендорфа Мунье"]
  ing:
    - [bi_subnitrate, 0.85, g]
    - [acetic_glacial, 10, mL]
    - [water, 40, mL]
    - [ki, 8, g]
    - [water, 20, mL]
    - [acetic_glacial, 2, mL, {role: {uz: "ishlatishdan oldin (1 ml eritmaga)", ru: "перед употреблением (на 1 мл раствора)", en: "before use (per 1 mL of stock)"}}]
    - [water, 10, mL, {role: {uz: "ishlatishdan oldin (1 ml eritmaga)", ru: "перед употреблением (на 1 мл раствора)", en: "before use (per 1 mL of stock)"}}]
  steps:
    - uz: "10 ml muzsimon sirka kislotada 0,85 g asosli vismut nitratni eriting va 40 ml suv qo‘shing."
      ru: "В 10 мл ледяной уксусной кислоты растворяют 0,85 г основного нитрата висмута и прибавляют 40 мл воды."
      en: "Dissolve 0.85 g of basic bismuth nitrate in 10 mL of glacial acetic acid and add 40 mL of water."
    - uz: "Unga 20 ml suvda 8 g kaliy yodid saqlovchi eritmani qo‘shing."
      ru: "К этой жидкости прибавляют раствор 8 г иодида калия в 20 мл воды."
      en: "Add a solution of 8 g of potassium iodide in 20 mL of water."
    - uz: "Ishlatishdan oldin shu eritmadan 1 ml oling, unga 2 ml muzsimon sirka kislota va 10 ml suv qo‘shing."
      ru: "Перед употреблением берут 1 мл этого раствора, прибавляют 2 мл ледяной уксусной кислоты и 10 мл воды."
      en: "Before use, take 1 mL of this solution and add 2 mL of glacial acetic acid and 10 mL of water."
  flags:
    - {kind: ambiguity, uz: "Asl matnda «Муиье» (OCR xatosi) — «Мунье» (Munier) deb o‘qildi.", ru: "В исходном тексте «Муиье» (ошибка распознавания) — прочитано как «Мунье».", en: "The original text reads «Муиье» (OCR error), read as «Мунье» (Munier)."}

- num: 34
  slug: sonnenschein
  names: {uz: "Zonnenshteyn reaktivi", ru: "Реактив Зонненштейна", en: "Sonnenschein reagent"}
  synonyms: ["Sonnenschein", "Zonnenshteyn", "Зонненштейна"]
  ing:
    - [na2hpo4, null, null, {q: as_needed}]
    - [nh4_moo4_in_hno3, null, null, {q: as_needed}]
    - [na2co3, null, null, {q: small_volume}]
    - [water, null, null, {q: tenfold}]
    - [hno3, null, null, {q: until_ppt_dissolves}]
  steps:
    - uz: "Natriy gidrofosfat eritmasiga ammoniy molibdatning nitrat kislotadagi eritmasini qo‘shing."
      ru: "К раствору моногидрофосфата натрия прибавляют раствор молибдата аммония в азотной кислоте."
      en: "Add a solution of ammonium molybdate in nitric acid to a solution of disodium hydrogen phosphate."
    - uz: "Hosil bo‘lgan cho‘kmani filtrlang va oz hajm natriy karbonat eritmasida eriting."
      ru: "Образовавшийся осадок отфильтровывают и растворяют в небольшом объёме раствора карбоната натрия."
      en: "Filter off the precipitate and dissolve it in a small volume of sodium carbonate solution."
    - uz: "Eritmani quruq qoldiqqacha bug‘lating, qoldiqni qizdirib kuydiring va soviting."
      ru: "Раствор выпаривают досуха, сухой остаток прокаливают и охлаждают."
      en: "Evaporate to dryness, ignite the residue and cool."
    - uz: "Qoldiqqa o‘n baravar miqdorda suv va cho‘kma eriguncha nitrat kislota qo‘shing."
      ru: "К остатку прибавляют десятикратное количество воды и азотную кислоту до растворения осадка."
      en: "Add a tenfold amount of water to the residue and nitric acid until the precipitate dissolves."
  flags:
    - {kind: ambiguity, uz: "Miqdor va konsentratsiyalar manbada berilmagan. Asl matnda nom «Зоннеишейиа» (OCR xatosi) — «Зонненштейна» deb o‘qildi.", ru: "Количества и концентрации в источнике не указаны. В исходном тексте «Зоннеишейиа» (ошибка распознавания) — прочитано как «Зонненштейна».", en: "The source gives no amounts or concentrations. The original reads «Зоннеишейиа» (OCR error), read as «Зонненштейна» (Sonnenschein)."}

- num: 35
  slug: mayer
  names: {uz: "Mayer reaktivi", ru: "Реактив Майера", en: "Mayer reagent"}
  synonyms: ["Mayer", "Mayer's reagent", "Майера", "Майер", "potassium mercuric iodide"]
  ing:
    - [hgcl2, 1.35, g]
    - [ki, 20, mL, {spec: "%:25"}]
    - [water, 100, mL, {to: true}]
  steps:
    - uz: "1,35 g simob(II) xloridga 20 ml 25 % li kaliy yodid eritmasini qo‘shing."
      ru: "К 1,35 г хлорида ртути (II) прибавляют 20 мл 25 %-го раствора иодида калия."
      en: "Add 20 mL of 25 % potassium iodide solution to 1.35 g of mercury(II) chloride."
    - uz: "Simob xlorid erigach, suv bilan 100 ml gacha yetkazing."
      ru: "После растворения хлорида ртути прибавляют воду до 100 мл."
      en: "Once the mercury chloride has dissolved, make up to 100 mL with water."

- num: 36
  slug: marquis
  merge: reagent-marquis
  names: {uz: "Marki reaktivi", ru: "Реактив Марки", en: "Marquis reagent"}
  synonyms: ["Marquis", "Marki", "Marquis reagent", "Марки", "Марки реактив"]
  ing:
    - [h2so4_conc, 1, mL]
    - [formalin, 1, drop]
  steps:
    - uz: "1 ml konsentrlangan sulfat kislotaga bir tomchi formalin qo‘shing va soviting."
      ru: "К 1 мл концентрированной серной кислоты прибавляют каплю формалина и охлаждают."
      en: "Add one drop of formalin to 1 mL of concentrated sulfuric acid and cool."
  stability: {uz: "Reaktiv yangi tayyorlangan holda ishlatiladi.", ru: "Реактив используют свежеприготовленным.", en: "Use the reagent freshly prepared."}

- num: 37
  slug: mandelin
  names: {uz: "Mandelin reaktivi", ru: "Реактив Манделина", en: "Mandelin reagent"}
  synonyms: ["Mandelin", "Манделина", "Манделин", "ammonium vanadate in sulfuric acid"]
