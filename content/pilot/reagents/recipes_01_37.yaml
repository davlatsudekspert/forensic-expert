      ru: "К 0,01 г ванадата аммония прибавляют 2 мл концентрированной серной кислоты."
      en: "Add 2 mL of concentrated sulfuric acid to 0.01 g of ammonium vanadate."
  stability: {uz: "Reaktiv yangi tayyorlangan bo‘lishi kerak.", ru: "Реактив должен быть свежеприготовленным.", en: "The reagent must be freshly prepared."}
